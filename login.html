 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAMMA-NIVAS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
    }

    .login-container {
      display: flex;
      width: 900px;
      max-width: 95%;
      min-height: 550px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    /* Left Side */
    .login-image {
      width: 50%;
      background:
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80")
        center/cover no-repeat;

      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 45px;
    }

    .login-image h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .login-image p {
      font-size: 16px;
      line-height: 1.6;
    }

    /* Right Side */
    .login-form {
      width: 50%;
      padding: 50px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      color: #1d4ed8;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .login-form h2 {
      font-size: 30px;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      gap: 7px;
      align-items: center;
      color: #555;
    }

    .forgot {
      color: #1d4ed8;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1d4ed8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #163da8;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      color: #999;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #ddd;
    }

    .social-buttons {
      display: flex;
      gap: 10px;
    }
    .login-back{
      text-align: right;
      color: black;
 
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .social-btn:hover {
      background: #f5f5f5;
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #666;
    }

    .signup a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: bold;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .login-container {
        flex-direction: column;
      }

      .login-image {
        width: 100%;
        min-height: 220px;
        padding: 30px;
      }

      .login-image h1 {
        font-size: 28px;
      }

      .login-form {
        width: 100%;
        padding: 35px 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <!-- Property Image -->
    <div class="login-image">
      <h1>Find Your Dream Home</h1>
      <p>
        Discover beautiful properties and find the perfect place
        to call home with NAMMA-NIVAS.
      </p>
    </div>

    <!-- Login Form -->
    <div class="login-form">
    <div class="login-back"><a href="index.html" class="login-back">Back</a></div>

      <div class="logo">NAMMA-NIVAS</div>

      <h2>Welcome Back</h2>
      <p class="subtitle">Login to manage your properties and account.</p>

      <form onsubmit="login(event)">

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>

          <a href="forgotpassword.html" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

      </form>

      <div class="divider">OR</div>

      <p class="signup">
        Don't have an account?
        <a href="CreateAccount.html">Create Account</a>
      </p>

    </div>
  </div>

  <script>
    function login(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Demo only — connect this to your backend authentication.
      if (email && password) {
        alert("Login successful!");
      }
    }

    function socialLogin(provider) {
      alert(provider + " login selected.");
    }
  </script>

</body>
</html>
